# Nginx 配置 - 盆景平台反向代理
# 安全设计：
# - HTTP 强制跳转 HTTPS（301 永久重定向）
# - HSTS 头部（max-age=1年，含子域名）
# - 完整安全头部（X-Frame/CSP/Referrer 等）
# - 上传文件大小限制 20M
# - 隐藏 Nginx 版本号
# - WebSocket 升级支持
# - 健康检查端点直通后端
# DevOps 设计：
# - limit_req 限流：按客户端 IP 限流，防 CC 攻击与慢速爬虫
# - limit_conn 连接数限制：防止单 IP 占满 worker 连接
# - 日志格式含 request_id 与上游响应时间，便于链路追踪与慢请求定位

worker_processes auto;

events {
    worker_connections 1024;
    # 单 worker 进程可同时打开的最大连接数（含客户端与上游）
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 隐藏版本号，避免暴露已知漏洞
    server_tokens off;

    # 日志格式（含上游响应时间与请求 ID，便于排查慢请求与链路追踪）
    # request_id 由 nginx 1.11+ 内置变量自动生成（$request_id）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid="$request_id" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ===== 限流配置（防 CC 攻击与慢速爬虫） =====
    # 按客户端 IP 维护 10MB 状态区（每条记录约 64 字节，约 16 万 IP）
    # 桶容量 10，速率 10 req/s（突发可排 10 个，超出返回 503）
    # 后端应用层已有 ThrottlerGuard（100 req/min），nginx 层前置过滤更高效
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    # limit_conn_zone：按 IP 限制并发连接数，防止单 IP 占满 worker 连接
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 限流时返回 429 而非默认 503，便于客户端区分"过载"与"服务异常"
    limit_req_status 429;
    limit_conn_status 429;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # 上传文件大小限制（与后端 MAX_FILE_SIZE 对齐，留余量给 multipart 头）
    client_max_body_size 20M;

    # 请求超时设置（避免慢速攻击 Slowloris）
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;

    # Gzip 压缩（仅压缩大于 1KB 的响应）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/xml+rss image/svg+xml;

    # 上游服务
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:4000;
        keepalive 32;
    }

    # ===== 通用安全头部（通过 include 复用） =====
    # 使用 map 区分是否启用 HSTS（仅 HTTPS 启用）
    map $scheme $hsts_header {
        https "max-age=31536000; includeSubDomains; preload";
        default "";
    }

    # ===== HTTP 服务：强制跳转 HTTPS =====
    server {
        listen 80;
        server_name _;
        # 全局连接数限制（每 IP 最多 20 个并发连接，超出返回 429）
        # 健康检查端点不计数，避免误伤探活
        limit_conn conn_limit 20;

        # 健康检查端点直通（不跳转 HTTPS，避免容器健康检查失败）
        # 必须放在 / 重定向之前
        # 不应用 limit_req，避免健康检查被限流误判
        location ~ ^/(health|health/live|health/ready)$ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 透传 request_id 到后端，便于全链路追踪
            proxy_set_header X-Request-Id $request_id;
            # 健康检查不需要长连接
            proxy_read_timeout 5s;
            access_log off;
        }

        # 其余所有请求 301 永久重定向到 HTTPS
        # 启用 SSL 证书后，取消下行注释即可启用强制跳转
        # return 301 https://$host$request_uri;

        # 未启用 SSL 时，HTTP 直接代理（开发/初始部署场景）
        # 安全头部
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 前端
        # burst=20：允许短时突发 20 个请求排队（用户体验友好）
        # nodelay：排队请求立即转发，不按速率延迟（避免响应变慢）
        location / {
            limit_req zone=req_limit burst=20 nodelay;
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
        }

        # API 代理
        # API 限流更严格：burst=10 防止单 IP 抢占后端资源
        location /api/ {
            limit_req zone=req_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
        }

        # Socket.io WebSocket 代理
        # WebSocket 不应用 limit_req（长连接，不符合 req/s 模型）
        # 但应用 limit_conn（已由 server 级别配置）
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            # WebSocket 长连接超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 健康检查（容器内 Nginx 自身健康检查）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 上传文件静态服务
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            # 防止 SVG/HTML 被内嵌执行（XSS 防护）
            if ($uri ~* \.(svg|html|htm)$) {
                add_header Content-Disposition "attachment";
            }
            # 禁止目录列表
            autoindex off;
        }
    }

    # ===== HTTPS 服务器 =====
    # 启用 SSL 证书后取消注释，并注释掉 HTTP server 中的代理配置
    # server {
    #     listen 443 ssl http2;
