# 盆景平台 Docker Compose 生产部署配置
#
# 安全设计：
# - MySQL/Redis 仅在内部网络访问，不映射端口到宿主机
# - 所有密码/密钥强制通过环境变量注入，不提供弱默认值
# - 后端以非 root 用户运行
# - 上传目录独立卷，权限受限
version: '3.8'

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: penjing-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: penjing_db
      MYSQL_USER: penjing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    # 不映射端口到宿主机，仅通过内部网络访问
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - penjing-network

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: penjing-redis
    restart: always
    # 启用密码保护
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # 不映射端口到宿主机，仅通过内部网络访问
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - penjing-network

  # ===== 后端 API =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: penjing-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://penjing:${MYSQL_PASSWORD}@mysql:3306/penjing_db"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: "4000"
      NODE_ENV: "production"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: "/app/uploads"
      MAX_FILE_SIZE: "5242880"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD must be set}
      # 可选：第二个管理员（留空则不创建）
      ADMIN2_USERNAME: ${ADMIN2_USERNAME:-}
      ADMIN2_EMAIL: ${ADMIN2_EMAIL:-}
      ADMIN2_PASSWORD: ${ADMIN2_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
      - backend_sentinel:/app/data
    ports:
      - "4000:4000"
    networks:
      - penjing-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:4000,host:'127.0.0.1'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s

  # ===== 前端 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: penjing-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    ports:
      - "3000:3000"
    networks:
      - penjing-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  backend_sentinel:

networks:
  penjing-network:
    driver: bridge
