# 盆景平台 CI 流水线
#
# 触发条件：
# - push 到 main / develop 分支
# - 提交 PR 到 main 分支
#
# 流程：
# 1. 后端 lint + build + Prisma 生成验证
# 2. 前端 lint + build 验证（standalone 模式）
# 3. Docker 镜像构建验证（确认 Dockerfile 可用）
# 4. 敏感信息扫描（防止 .env / 密钥进入仓库）
# 5. YAML/Shell 语法校验
#
# 设计原则：
# - Job 并行执行，缩短反馈周期
# - 失败 fast-fail，不浪费资源跑后续 job
# - 不部署到任何环境（部署由 deploy.sh 在服务器端手动触发）

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 同分支并发时取消旧的运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== 后端验证 =====
  backend:
    name: Backend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"
        run: npx prisma generate

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        env:
          JWT_SECRET: "ci-dummy-secret-32-chars-or-longer-padding"
          JWT_REFRESH_SECRET: "ci-dummy-refresh-secret-32-chars-or-longer-padding"
          ADMIN_DEFAULT_PASSWORD: "CIPassword123"
          NODE_ENV: "production"
        run: npm run build

  # ===== 前端验证 =====
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "/api/v1"
          NEXT_PUBLIC_SOCKET_URL: ""
        run: npm run build

  # ===== Docker 镜像构建验证 =====
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: penjing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: penjing-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 敏感信息扫描 =====
  security-scan:
    name: Secrets & sensitive info scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env files in repo
        run: |
          # .env.example 允许入库；其他 .env 不允许
          if find . -name ".env*" -not -path "./.git/*" -not -name ".env.example" | grep -q .; then
            echo "::error::发现 .env 文件，禁止提交到仓库"
            find . -name ".env*" -not -path "./.git/*" -not -name ".env.example"
            exit 1
          fi
          echo "✅ 未发现 .env 文件"

      - name: Check for hardcoded secrets
        run: |
          # 扫描常见敏感模式：密码、密钥、私钥
          # 排除：.git、.env.example（占位符）、node_modules、文档（示例值）
          PATTERNS='\
            -e "BEGIN RSA PRIVATE KEY" \
            -e "BEGIN EC PRIVATE KEY" \
            -e "BEGIN OPENSSH PRIVATE KEY" \
            -e "password\s*=\s*[\"'\''][^\"'\'']{6,}" \
            -e "secret\s*=\s*[\"'\''][^\"'\'']{20,}" \
          '
          if grep -rE $PATTERNS \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --include="*.yml" --include="*.yaml" --include="*.sh" \
            --include="*.conf" --include="*.md" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude="*.example" \
            . ; then
            echo "::error::发现疑似硬编码密钥/密码"
            exit 1
          fi
          echo "✅ 未发现硬编码密钥"

      - name: Check for placeholder values in .env.example
        run: |
          # 确保 .env.example 不含真实密码（所有占位符必须保留）
          if grep -E "=[^R].{0,30}(password|secret|key)" .env.example | grep -v "REPLACE_WITH\|CHANGE_ME\|admin@example.com\|penjing.example.com\|example.com" ; then
            echo "::error::.env.example 包含疑似真实凭据"
            exit 1
          fi
          echo "✅ .env.example 占位符正常"

      - name: Check for real domain/IP leaks
        run: |
          # AGENTS.md 脱敏规范：不允许真实服务器 IP / 域名 / 邮箱 / 部署路径
          # 此处仅做最基础的检测（无占位符的 IP、可疑域名），完整审计应人工复核
          if grep -rE "([0-9]{1,3}\.){3}[0-9]{1,3}" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --include="*.yml" --include="*.yaml" --include="*.sh" \
            --include="*.conf" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude="*.example" \
            . | grep -vE "127\.0\.0\.1|0\.0\.0\.0|255\.|169\.254\.|192\.168\.|10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[01]\.|localhost|example\.com|docker-compose|deploy\.sh|remote-setup\.sh|remote-rebuild\.sh|backend-health" ; then
            echo "::warning::发现可能的公网 IP，请人工复核是否为占位符"
          fi
          echo "✅ 域名/IP 扫描完成"

  # ===== 配置文件语法校验 =====
  config-validate:
    name: Config syntax validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          for f in docker-compose.yml docker-compose.dev.yml; do
            echo "校验 $f ..."
            docker compose -f "$f" config -q
          done

      - name: Validate nginx config
        run: |
          # 使用临时 nginx 容器校验配置语法
          # 由于配置中引用了 upstream（frontend/backend），无法直接 -t，
          # 改为简单语法检查：确保 include / log_format / server 块匹配
          docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.25-alpine nginx -t 2>&1 || \
            echo "::warning::nginx 配置校验需要完整上下文（upstream 解析），仅作参考"

      - name: Validate shell scripts syntax
        run: |
          for f in deploy.sh remote-setup.sh remote-rebuild.sh backend/start.sh; do
            if [ -f "$f" ]; then
              echo "校验 $f ..."
              bash -n "$f" || exit 1
            fi
          done
          echo "✅ Shell 脚本语法正常"
